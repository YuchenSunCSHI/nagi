<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#142d30">
  <title>水面</title>
</head>
<body>
  <main>
    <canvas id="water" role="img" aria-label="阳光下缓缓流动的河面"></canvas>
    <canvas id="mountain" role="img" aria-label="金色晨光下的雪山" hidden></canvas>
    <div class="scene-picker">
      <button id="scene-toggle" type="button" aria-label="切换场景" aria-expanded="false" aria-controls="scene-options" title="切换场景">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="m3 18 6-10 4 6 3-4 5 8z"/>
          <path d="M17 6h.01"/>
        </svg>
      </button>
      <div id="scene-options" role="group" aria-label="场景" hidden>
        <button type="button" data-scenery="lake" aria-pressed="true">宁静湖面</button>
        <button type="button" data-scenery="mountain" aria-pressed="false">日照金山</button>
      </div>
      <p id="scene-status" role="status" hidden></p>
    </div>
    <div class="scene-hud">
      <p id="sound-error" role="status" hidden></p>
      <div class="scene-controls" role="group" aria-label="水景控制">
        <fieldset id="lighting" class="scene-lighting" disabled>
          <legend class="visually-hidden">光照</legend>
          <label title="白天">
            <input type="radio" name="lighting" value="day" aria-label="白天" checked>
            <span aria-hidden="true">
              <svg viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="4"/>
                <path d="M12 3v2m0 14v2M3 12h2m14 0h2M5.6 5.6 7 7m10 10 1.4 1.4m0-12.8L17 7M7 17l-1.4 1.4"/>
              </svg>
            </span>
          </label>
          <label title="傍晚">
            <input type="radio" name="lighting" value="sunset" aria-label="傍晚">
            <span aria-hidden="true">
              <svg viewBox="0 0 24 24">
                <path d="M3 15h18M7 15a5 5 0 0 1 10 0M12 4v2m-7 2 1.5 1.5M19 8l-1.5 1.5M7 19h10"/>
              </svg>
            </span>
          </label>
          <label title="月光">
            <input type="radio" name="lighting" value="night" aria-label="月光">
            <span aria-hidden="true">
              <svg viewBox="0 0 24 24">
                <path d="M20.5 15A8.5 8.5 0 0 1 9 3.5 8.5 8.5 0 1 0 20.5 15Z"/>
              </svg>
            </span>
          </label>
        </fieldset>
        <button id="sound" class="scene-sound" type="button" aria-pressed="false" aria-busy="true" aria-label="声音" title="声音" disabled>
          <svg class="sound-icon" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M3.5 9h4L12 5.5v13L7.5 15h-4z"/>
            <path class="sound-wave" d="M15.5 9a4.2 4.2 0 0 1 0 6m2.7-8.5a7.8 7.8 0 0 1 0 11"/>
            <path class="sound-mute" d="m16 9.5 5 5m0-5-5 5"/>
          </svg>
          <svg class="sound-wait" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="7"/>
            <path d="M12 8.5V12l2.5 1.5"/>
          </svg>
        </button>
      </div>
    </div>
    <p id="message" role="status" hidden></p>
  </main>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
